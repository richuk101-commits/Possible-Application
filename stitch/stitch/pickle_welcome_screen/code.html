<script id="tailwind-config">

        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #FFFFFF;
            min-height: max(844px, 100dvh);
        }
        .neon-btn {
            box-shadow: var(--neon-glow);
            transition: all 0.3s ease;
        }
        .neon-btn:active {
            box-shadow: 0 0 15px rgba(163, 230, 53, 0.5);
            transform: scale(0.96);
        }
        .text-stroke {
            -webkit-text-stroke: 1.5px #0A0A0A;
            color: transparent;
        }
        .dynamic-rotation-1 { transform: rotate(-8deg) scale(1.05); }

            height: 48px;

        .logo-circle {

        .logo-strike {

            background-color: #A3E635;transform: rotate(-15deg);
            top: -2px;left: 26px;
            border-radius: 2px;
        }

<style>
