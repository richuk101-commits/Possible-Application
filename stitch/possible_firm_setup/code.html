<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Possible — Firm Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#131b2e",
                    "on-primary-fixed-variant": "#005049",
                    "on-secondary-fixed-variant": "#2f2ebe",
                    "outline": "#6d7a77",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#006a61",
                    "on-secondary-fixed": "#07006c",
                    "surface": "#faf8ff",
                    "on-tertiary-container": "#f5fff6",
                    "tertiary-fixed": "#6ffbbe",
                    "primary-fixed": "#89f5e7",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed-dim": "#4edea3",
                    "secondary-container": "#6063ee",
                    "on-background": "#131b2e",
                    "surface-container-highest": "#dae2fd",
                    "secondary-fixed": "#e1e0ff",
                    "surface-dim": "#d2d9f4",
                    "on-tertiary-fixed": "#002113",
                    "primary-container": "#008378",
                    "outline-variant": "#bcc9c6",
                    "error": "#ba1a1a",
                    "primary": "#00685f",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f2f3ff",
                    "surface-bright": "#faf8ff",
                    "secondary-fixed-dim": "#c0c1ff",
                    "secondary": "#4648d4",
                    "surface-container-high": "#e2e7ff",
                    "on-tertiary-fixed-variant": "#005236",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#eaedff",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#6bd8cb",
                    "surface-variant": "#dae2fd",
                    "background": "#faf8ff",
                    "inverse-primary": "#6bd8cb",
                    "tertiary": "#006947",
                    "inverse-surface": "#283044",
                    "on-surface-variant": "#3d4947",
                    "on-secondary-container": "#fffbff",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#f4fffc",
                    "on-primary-fixed": "#00201d",
                    "inverse-on-surface": "#eef0ff",
                    "tertiary-container": "#00855b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- Top Navigation Bar (Shared Component Logic) -->
<header class="bg-[#FAF8FF] dark:bg-[#0D1321] font-['Inter'] antialiased tracking-tight sticky top-0 z-50">
<div class="flex justify-between items-center px-6 py-6 w-full max-w-7xl mx-auto">
<div class="text-2xl font-black tracking-tighter text-[#131B2E] dark:text-[#FAF8FF]">
                Possible
            </div>
<!-- Progress Stepper -->
<div class="flex items-center gap-3">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full border-2 border-outline-variant"></div>
<div class="w-2.5 h-2.5 rounded-full border-2 border-outline-variant"></div>
</div>
<div class="text-on-surface-variant text-sm font-medium">
                Help
            </div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-start pt-12 pb-24 px-6">
<!-- Page Header -->
<div class="text-center mb-12 max-w-xl">
<h1 class="text-[28px] font-extrabold tracking-tight text-on-surface mb-3">Set up your firm profile</h1>
<p class="text-on-surface-variant text-base">This takes 2 minutes. Your logo and name will appear on every report.</p>
</div>
<!-- Form Container -->
<div class="w-full max-w-[480px] space-y-8">
<form class="space-y-6">
<!-- Firm Name -->
<div class="space-y-2">
<label class="block text-[11px] font-bold tracking-[0.05em] text-on-surface-variant uppercase">Firm Name</label>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 text-lg font-medium transition-colors" placeholder="e.g. Spencers Estate Agents" type="text" value="Spencers Estate Agents"/>
</div>
<!-- Your Name -->
<div class="space-y-2">
<label class="block text-[11px] font-bold tracking-[0.05em] text-on-surface-variant uppercase">Your Name</label>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 text-lg font-medium transition-colors" placeholder="Full name" type="text"/>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="block text-[11px] font-bold tracking-[0.05em] text-on-surface-variant uppercase">Email Address</label>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 text-lg font-medium transition-colors" placeholder="name@firm.com" type="email"/>
</div>
<!-- Firm Logo Upload Zone -->
<div class="space-y-3">
<label class="block text-[11px] font-bold tracking-[0.05em] text-on-surface-variant uppercase">Firm Logo</label>
<div class="group relative flex flex-col items-center justify-center border-2 border-dashed border-outline-variant rounded-xl p-8 bg-surface-container-lowest hover:border-primary hover:bg-primary/5 transition-all cursor-pointer">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary text-4xl mb-2" data-icon="cloud_upload">cloud_upload</span>
<p class="text-sm font-medium text-on-surface">Click to upload or drag and drop</p>
<p class="text-xs text-on-surface-variant mt-1">SVG, PNG, or JPG (max. 800x400px)</p>
<input class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Your Location -->
<div class="space-y-2">
<label class="block text-[11px] font-bold tracking-[0.05em] text-on-surface-variant uppercase">Your Location</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 text-lg font-medium transition-colors pr-10" placeholder="City, Country" type="text"/>
<span class="material-symbols-outlined absolute right-0 top-3 text-on-surface-variant" data-icon="location_on">location_on</span>
</div>
</div>
<!-- Data Agreement -->
<div class="flex items-start gap-3 pt-4">
<div class="flex items-center h-5">
<input class="w-5 h-5 border-outline-variant rounded text-primary focus:ring-primary" id="agreement" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-relaxed" for="agreement">
                        I agree to the <a class="text-primary font-semibold hover:underline" href="#">Data Processing Agreement</a> and confirm I have the authority to manage this firm profile.
                    </label>
</div>
<!-- CTA Actions -->
<div class="flex items-center justify-between pt-8">
<button class="flex items-center gap-2 text-on-surface-variant font-semibold hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
                        Back
                    </button>
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary px-8 py-4 rounded-full font-bold shadow-lg shadow-primary/20 hover:brightness-110 active:scale-95 transition-all flex items-center gap-2" type="submit">
                        Continue
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Visual Background Decoration (Subtle asymmetric element) -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-primary-fixed opacity-10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed -top-24 -right-24 w-64 h-64 bg-secondary-fixed opacity-10 rounded-full blur-[100px] pointer-events-none"></div>
</main>
<!-- Footer (Shared Component Logic) -->
<footer class="bg-[#F2F3FF] dark:bg-[#131B2E] font-['Inter'] text-sm tracking-wide full-width py-12 border-t border-slate-200/10 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-8 w-full max-w-7xl mx-auto">
<div class="text-[#3D4947] mb-4 md:mb-0">
                © 2024 Possible. All rights reserved.
            </div>
<div class="flex gap-8">
<a class="text-[#3D4947] hover:text-teal-500 transition-colors" href="#">Privacy Policy</a>
<a class="text-[#3D4947] hover:text-teal-500 transition-colors" href="#">Terms of Service</a>
<a class="text-[#3D4947] hover:text-teal-500 transition-colors" href="#">Contact Support</a>
</div>
</div>
</footer>
</body></html>
